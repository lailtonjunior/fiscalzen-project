# ===========================================
# FiscalZen - Production Docker Compose
# Blue-Green Deployment Configuration
# ===========================================

version: '3.9'

services:
  # ============================================
  # API - Blue Environment
  # ============================================
  fiscalzen-api-blue:
    image: ghcr.io/${GITHUB_REPOSITORY}/api:${VERSION:-latest}
    container_name: fiscalzen-api-blue
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - INSTANCE_COLOR=blue
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - fiscalzen-network

  # ============================================
  # API - Green Environment
  # ============================================
  fiscalzen-api-green:
    image: ghcr.io/${GITHUB_REPOSITORY}/api:${VERSION:-latest}
    container_name: fiscalzen-api-green
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - INSTANCE_COLOR=green
    ports:
      - "3011:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - fiscalzen-network
    profiles:
      - blue-green

  # ============================================
  # Web - Blue Environment
  # ============================================
  fiscalzen-web-blue:
    image: ghcr.io/${GITHUB_REPOSITORY}/web:${VERSION:-latest}
    container_name: fiscalzen-web-blue
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - INSTANCE_COLOR=blue
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - fiscalzen-network

  # ============================================
  # Web - Green Environment
  # ============================================
  fiscalzen-web-green:
    image: ghcr.io/${GITHUB_REPOSITORY}/web:${VERSION:-latest}
    container_name: fiscalzen-web-green
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - INSTANCE_COLOR=green
    ports:
      - "3010:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - fiscalzen-network
    profiles:
      - blue-green

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: fiscalzen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-fiscalzen}
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-fiscalzen}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    networks:
      - fiscalzen-network

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: fiscalzen-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass_file /run/secrets/redis_password
      --appendonly yes
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - fiscalzen-network

  # ============================================
  # Meilisearch
  # ============================================
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: fiscalzen-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY_FILE: /run/secrets/meilisearch_key
      MEILI_NO_ANALYTICS: true
    secrets:
      - meilisearch_key
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    networks:
      - fiscalzen-network

  # ============================================
  # MinIO Object Storage
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: fiscalzen-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    secrets:
      - minio_user
      - minio_password
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    networks:
      - fiscalzen-network

  # ============================================
  # Nginx Reverse Proxy / Load Balancer
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: fiscalzen-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - fiscalzen-api-blue
      - fiscalzen-web-blue
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fiscalzen-network

# ============================================
# Secrets (Docker Swarm / Compose Secrets)
# ============================================
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  meilisearch_key:
    file: ./secrets/meilisearch_key.txt
  minio_user:
    file: ./secrets/minio_user.txt
  minio_password:
    file: ./secrets/minio_password.txt

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  minio_data:
    driver: local
  nginx_logs:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  fiscalzen-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
