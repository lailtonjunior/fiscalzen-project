version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fiscalzen-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: fiscalzen
      POSTGRES_PASSWORD: fiscalzen_dev
      POSTGRES_DB: fiscalzen
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fiscalzen -d fiscalzen']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fiscalzen-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: fiscalzen-meilisearch
    restart: unless-stopped
    ports:
      - '7700:7700'
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: fiscalzen_meilisearch_dev_key
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: fiscalzen-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: fiscalzen
      MINIO_ROOT_PASSWORD: fiscalzen_minio_dev
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  # Create default bucket on startup
  minio-init:
    image: minio/mc:latest
    container_name: fiscalzen-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 fiscalzen fiscalzen_minio_dev;
      mc mb minio/fiscalzen-docs --ignore-existing;
      mc anonymous set download minio/fiscalzen-docs;
      exit 0;
      "

  # ===========================================
  # Application Services (opcional para dev local)
  # Use: docker compose --profile app up
  # ===========================================
  api:
    profiles: ['app']
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: fiscalzen-api
    restart: unless-stopped
    ports:
      - '3001:3001'
      - '3002:3002'  # WebSocket
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://fiscalzen:fiscalzen_dev@postgres:5432/fiscalzen
      REDIS_URL: redis://redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: fiscalzen_meilisearch_dev_key
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: fiscalzen
      S3_SECRET_KEY: fiscalzen_minio_dev
      S3_BUCKET: fiscalzen-docs
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: docker_dev_jwt_secret_change_in_production_32chars
      CERT_ENCRYPTION_KEY: ZG9ja2VyX2Rldl9jZXJ0X2tleV9jaGFuZ2VfaW5fcHJvZA==
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3001/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    profiles: ['app']
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: fiscalzen-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  minio_data:

networks:
  default:
    name: fiscalzen-network
