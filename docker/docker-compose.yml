# ===========================================
# FiscalZen - Docker Compose
# ===========================================
# Uso desenvolvimento: docker compose up
# Uso com apps: docker compose --profile app up
# ===========================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: fiscalzen-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: fiscalzen
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: fiscalzen
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U fiscalzen -d fiscalzen' ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fiscalzen-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    command: >
      sh -c "redis-server --appendonly yes --requirepass $$(cat /run/secrets/redis_password)"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: fiscalzen-meilisearch
    restart: unless-stopped
    ports:
      - '7700:7700'
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    secrets:
      - meilisearch_key
    volumes:
      - meilisearch_data:/meili_data
    command: >
      sh -c "export MEILI_MASTER_KEY=$$(cat /run/secrets/meilisearch_key) && meilisearch"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:7700/health' ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: fiscalzen-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    secrets:
      - minio_user
      - minio_password
    volumes:
      - minio_data:/data
    entrypoint: >
      /bin/sh -c " export MINIO_ROOT_USER=$$(cat /run/secrets/minio_user) && export MINIO_ROOT_PASSWORD=$$(cat /run/secrets/minio_password) && /usr/bin/docker-entrypoint.sh server /data --console-address ':9001' "
    # command: server /data --console-address ':9001' (overridden by entrypoint above)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live' ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Create default bucket on startup (private access)
  minio-init:
    image: minio/mc:latest
    container_name: fiscalzen-minio-init
    depends_on:
      minio:
        condition: service_healthy
    secrets:
      - minio_user
      - minio_password
    entrypoint: >
      /bin/sh -c " mc alias set minio http://minio:9000 $$(cat /run/secrets/minio_user) $$(cat /run/secrets/minio_password); mc mb minio/fiscalzen-docs --ignore-existing; mc anonymous set none minio/fiscalzen-docs; exit 0; "

  # ===========================================
  # Application Services (opcional para dev local)
  # Use: docker compose --profile app up
  # ===========================================
  api:
    profiles: [ 'app' ]
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: fiscalzen-api
    restart: unless-stopped
    ports:
      - '3001:3001'
      - '3002:3002' # WebSocket
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://fiscalzen:fiscalzen_dev@postgres:5432/fiscalzen
      REDIS_URL: redis://redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: fiscalzen-docs
      CORS_ORIGIN: http://localhost:3000
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    env_file:
      - .env.api
    secrets:
      - jwt_secret
      - cert_encryption_key
      - meilisearch_key
      - minio_user
      - minio_password
      - redis_password
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD', 'wget', '--spider', '-q', 'http://localhost:3001/health' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    profiles: [ 'app' ]
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: fiscalzen-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/health' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ===========================================
  # Observability Stack
  # ===========================================
  # ===========================================
  # Observability Stack
  # ===========================================
  prometheus:
    profiles: [ 'app' ]
    image: prom/prometheus
    volumes:
      - ./prometheus:/etc/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    profiles: [ 'app' ]
    image: grafana/grafana
    ports:
      - "3003:3000"
    depends_on:
      prometheus:
        condition: service_started

  jaeger:
    profiles: [ 'app' ]
    image: jaegertracing/all-in-one
    container_name: jaeger
    ports:
      - "16686:16686" # UI
      - "14268:14268" # Collector (HTTP)
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  minio_data:


networks:
  default:
    name: fiscalzen-network

# ===========================================
# Secrets - Arquivos locais em docker/secrets/
# ===========================================
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  meilisearch_key:
    file: ./secrets/meilisearch_key.txt
  minio_user:
    file: ./secrets/minio_user.txt
  minio_password:
    file: ./secrets/minio_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  cert_encryption_key:
    file: ./secrets/cert_encryption_key.txt
